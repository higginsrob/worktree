# wkt baseline tmux config (system-wide: /etc/tmux.conf).
# Statusline badges + click bindings (project plan decision #9) are added in milestone 6.
# The default vim+shell split (decision #7) is created by `wkt open`, not by this file.

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'

set -g mouse on
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g escape-time 10
set -g history-limit 10000
set -g focus-events on
set -g status-position bottom

# `wkt open` attaches with:
#   tmux new-session -A -s main -c /workspace/<repo>
