# wkt tmux config (system-wide: /etc/tmux.conf).

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'

set -g mouse on
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g escape-time 10
set -g history-limit 10000
set -g focus-events on
set -g status-position bottom
set -g status-interval 5

# `wkt open`/`wkt add` attach with:
#   tmux new-session -A -s main -c /workspace/<repo>
# `-A` attaches if "main" already exists; this hook only fires the one time
# a brand-new session is actually created (project plan decision #7).
set-hook -g session-created 'send-keys "vim" Enter ; split-window -v -c "#{pane_current_path}"'

# --- Statusline badges (project plan decision #9) ---------------------------
# +          new window            | -/|   split horizontal/vertical
# (window list is tmux's built-in, already clickable to select a window)
# WORKSPACE  org/repo · branch, click copies it | GIT  branch, click → status popup
# No push/pull/sync live here — those stay host-only `wkt` commands.

set -g status-left-length 12
set -g status-left '#[range=user|new-window,fg=colour2,bold] + #[norange,default]'

set -g status-right-length 100
set -g status-right '#[range=user|split-h,fg=colour3,bold] - #[norange,default]#[range=user|split-v,fg=colour6,bold] | #[norange,default] #[range=user|workspace]#(wkt-workspace-badge)#[norange] #[range=user|git-status]#(wkt-git-badge)#[norange] '

bind-key -n MouseDown1StatusLeft run-shell -b "wkt-status-click '#{mouse_status_range}' '#{pane_current_path}'"
bind-key -n MouseDown1StatusRight run-shell -b "wkt-status-click '#{mouse_status_range}' '#{pane_current_path}'"

# --- OSC 52 clipboard passthrough -------------------------------------------
# Reaches the host terminal's real clipboard over the docker exec -it PTY.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "osc52-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "osc52-copy"
