# wkt tmux config (system-wide: /etc/tmux.conf).

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'

set -g mouse on
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g escape-time 10
set -g history-limit 10000
set -g focus-events on
set -g status-position bottom
set -g status-interval 5

# --- tokyonight theming ------------------------------------------------
# status-style bg is "default" (the terminal's own background), not a
# hardcoded color, so the statusline matches whatever terminal theme the
# host is using instead of forcing tokyonight's navy behind the text.
set -g status-style "bg=default,fg=#a9b1d6"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# --- vim-tmux-navigator: seamless Ctrl-hjkl between vim splits and tmux
# panes (vim plugin is bundled at build time; see vimrc). ------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# `wkt open`/`wkt add` attach with:
#   tmux new-session -A -s <name> -c <workdir>
# `-A` attaches if the session already exists; this hook only fires the one
# time a brand-new session is actually created (project plan decision #7).
# `vim .` opens netrw at the repo root in a single pane (no default split;
# use the vim leader t/T/a/A mappings or the statusline buttons to add tmux
# panes). `$WKT_VIMRC` is set by the
# host CLI before spawning tmux — /etc/vim/vimrc.local in the sandbox
# container, the package's bundled vimrc on the host — so this one hook
# works unmodified for both (see docs/editor.md).
set-hook -g session-created 'send-keys "vim -u \"$WKT_VIMRC\" ." Enter'

# --- Statusline badges (project plan decision #9) ---------------------------
# Solid-color pill buttons (dark text on a bright background), not colored
# text on the default background — colored text alone reads as unreadable.
# -  |  +   split horizontal/vertical, new window — grouped at the far left
# window tabs  #I:#W, current window highlighted — click to select
# WORKSPACE  org/repo · branch, click copies it | GIT  branch, click → status popup
# No push/pull/sync live here — those stay host-only `wkt` commands.

FG_DARK="#1a1b26"

# range names are tied to the tmux split flag wkt-status-click runs
# (split-h = `split-window -h`, side-by-side/vertical divider; split-v =
# `split-window -v`, stacked/horizontal divider), so the "-" glyph is
# bound to split-v and "|" to split-h to match what each looks like.
set -g status-left-length 20
set -g status-left "#[range=user|split-v,fg=${FG_DARK},bg=#e0af68,bold] - #[norange,default]#[range=user|split-h,fg=${FG_DARK},bg=#7dcfff,bold] | #[norange,default]#[range=user|new-window,fg=${FG_DARK},bg=#9ece6a,bold] + #[norange,default]"

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=${FG_DARK},bg=#bb9af7,bold] #I:#W #[default]"
setw -g window-status-separator ""

set -g status-right-length 100
set -g status-right "#[range=user|workspace]#(wkt-workspace-badge #{session_name})#[norange] #[range=user|git-status]#(wkt-git-badge #{session_name})#[norange] "

# Clicks on `range=user|...` areas are reported as plain MouseDown1Status (not
# StatusLeft/StatusRight, which only fire for tmux's own left/right ranges), so
# one binding handles everything. Window tabs keep the default select-window.
bind-key -n MouseDown1Status if-shell -F "#{==:#{mouse_status_range},window}" \
  "select-window -t =" \
  "run-shell -b \"wkt-status-click '#{mouse_status_range}' '#{pane_current_path}' '#{session_name}'\""

# --- Double Ctrl-C / Ctrl-C then Ctrl-D -------------------------------------
# First C-c still passes through to interrupt whatever's running. A second
# C-c within 1s (tracked in /tmp by the helper script, scoped per session)
# pops a confirm-before prompt to kill the whole session, not just the
# foreground process. C-d within 1s of that same C-c detaches instead;
# outside that window C-d passes through as normal (shell EOF, vim
# half-page scroll, etc).
bind-key -n C-c send-keys C-c \; run-shell -b "wkt-doublec-check '#{session_name}'"
bind-key -n C-d run-shell -b "wkt-detach-check '#{session_name}' '#{pane_id}'"

# --- OSC 52 clipboard passthrough -------------------------------------------
# Reaches the host terminal's real clipboard over the docker exec -it PTY.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "osc52-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "osc52-copy"
